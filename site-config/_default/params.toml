######################## site params ######################

# Homepage-level meta (overridable per page via frontmatter .Description / .Title).
# Keep description <=155 chars for SERP truncation.
description = "Headless Mode makes software for music practice, project management, media production and exploring rural places. Straightforward to use."
author = "Headless Mode"
slogan = "The name means focus. So does the software."

# rigscore version + all check counts are data-driven from data/rigscore.json
# (Site.Data.rigscore), regenerated by the rigscore release job. The old
# rigscoreVersion knob was retired here so version can never drift from the facts.

# OG / Twitter default image (1200x630). Per-page posts may override via Params.ogImage.
ogImage = "/og/default.png"

# Social
twitterHandle = "@HeadlessMode"
facebookPage = "https://www.facebook.com/HeadlessMode"

# No analytics, no ads, no telemetry — enforced site-wide.
# See themes/headlessmode/layouts/partials/head.html and /privacy/.
